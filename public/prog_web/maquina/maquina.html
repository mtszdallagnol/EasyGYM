<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyGym - Gerenciar Máquina</title>
    <link rel="stylesheet" href="maquina.css">
    <link rel="stylesheet" href="../main.css">

    <!-- Link para o arquivo JavaScript externo -->
    <script src="maquina.js"></script>
</head>
<body>
<div class="container">
    <!-- Menu lateral com barra de navegação -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <h1>EASYGYM</h1>
            <p>FITNESS SOFTWARE</p>
        </div>
        <nav class="menu">
            <a href="../gerenciamento/gerenciamento.html">Menu</a>
            <a href="../aluno/aluno.html">Alunos</a>
            <a href="../aulasEspeciais/aulasEspeciais.html">Aulas Esp.</a>
            <a href="../cargos/cargos.html">Cargos</a>
            <a href="../instrutor/instrutor.html">Instrutores</a>
            <a href="../maquina/maquina.html" class="active">Máquinas</a>
            <a href="../treinos/treinos.html">Treinos</a>
        </nav>
        <div class="logout">
            <a href="#">Sair</a>
        </div>
    </aside>

    <!-- Ícone de menu hambúrguer para dispositivos móveis -->
    <div class="hamburger" onclick="toggleSidebar()">
        ☰
    </div>

    <!-- Botões para ações -->
    <div class="button-group">
        <button class="btn btn-add" id="adicionar-atividade">Adicionar Máquina</button>
    </div>

    <!-- Tabela de Atividades -->
    <table id="tabela-atividades">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Marca</th>
            <th>Grupo Muscular</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- As linhas da tabela serão inseridas via JavaScript -->
        </tbody>
    </table>

    <!-- Modal de Adicionar/Editar -->
    <div id="modal-container" class="modal-container">
        <div class="modal-content">
            <h2 id="modal-titulo">Adicionar Máquina</h2>
            <form id="form-atividade">
                <input type="hidden" id="id-atividade" name="id"> <!-- Campo oculto para o ID da atividade -->
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="name" required><br><br>

                <label for="marca">Marca:</label>
                <input type="text" id="marca" name="marca" required><br><br>

                <label for="grupo">Grupo muscular:</label>
                <input type="text" id="grupo" name="grupo" required><br><br>

                <button class="btn btn-edit" type="submit" id="submit-atividade">Salvar</button>
                <button class="btn btn-delete" type="button" id="fechar-modal">Fechar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
